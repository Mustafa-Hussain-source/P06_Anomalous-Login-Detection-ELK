version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-7.10.1}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-7.10.1}
    container_name: logstash
    environment:
      - SQLITE_JDBC_JAR=/usr/share/logstash/vendor/jdbc/sqlite-jdbc.jar
      - ALDS_DB_PATH=/data/alds.db
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./jdbc:/usr/share/logstash/vendor/jdbc:ro
      - ../:/data
    depends_on:
      - elasticsearch
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-7.10.1}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  wazuh:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.3}
    container_name: wazuh-manager
    volumes:
      - wazuh-logs:/var/ossec/logs
    ports:
      - "${WAZUH_API_PORT:-55000}:55000"
    networks:
      - elk

  wazuh-indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.3}
    container_name: wazuh-indexer
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ports:
      - "9201:9200"
    networks:
      - elk

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.3}
    container_name: wazuh-dashboard
    volumes:
      - ./config/wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    environment:
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5602:5601"
    depends_on:
      - wazuh-indexer
      - wazuh
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-7.10.1}
    container_name: filebeat
    user: root
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - wazuh-logs:/var/ossec/logs:ro
      - ../:/data:ro
    command: ["--strict.perms=false"]
    depends_on:
      - logstash
      - wazuh
    networks:
      - elk

networks:
  elk:
    driver: bridge

volumes:
  esdata:
  wazuh-logs:
  wazuh-indexer-data: