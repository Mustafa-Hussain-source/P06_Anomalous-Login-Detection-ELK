input {
  jdbc {
    jdbc_driver_library => "${SQLITE_JDBC_JAR:/usr/share/logstash/vendor/jdbc/sqlite-jdbc.jar}"
    jdbc_driver_class => "org.sqlite.JDBC"
    jdbc_connection_string => "jdbc:sqlite:${ALDS_DB_PATH:/data/alds.db}"
    jdbc_user => ""
    jdbc_password => ""
    statement => "SELECT * FROM login_events WHERE id > :sql_last_value"
    use_column_value => true
    tracking_column => "id"
    schedule => "*/5 * * * * *"
  }
  beats {
    port => 5044
  }
}

filter {
  if [fileset][module] == "wazuh" or [wazuh] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
  if ![event][dataset] {
    mutate {
      add_field => { "[event][dataset]" => "alds-login-events" }
    }
  }
  mutate {
    convert => {
      "is_suspicious" => "boolean"
      "risk_score" => "integer"
      "impossible_travel" => "boolean"
      "latitude" => "float"
      "longitude" => "float"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[event][dataset]}"
  }
  elasticsearch {
    hosts => ["https://wazuh-indexer:9200"]
    user => "admin"
    password => "admin"
    ssl => true
    ssl_certificate_verification => false
    index => "%{[event][dataset]}"
  }
  stdout { codec => json }
}