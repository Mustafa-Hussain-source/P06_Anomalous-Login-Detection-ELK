filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/ossec/logs/alerts/alerts.json
      - /data/wazuh/alerts/alerts.json
    json.keys_under_root: true
    json.add_error_key: true
    fields_under_root: true
    fields:
      event:
        dataset: wazuh-alerts

  - type: log
    enabled: true
    paths:
      - /var/ossec/logs/*.log
      - /var/ossec/logs/**/*.log
      - /var/ossec/logs/**/*.json
    exclude_files:
      - 'alerts\.json$'
    fields_under_root: true
    fields:
      event:
        dataset: wazuh-logs

output.logstash:
  hosts: ["logstash:5044"]

setup.template.enabled: false
setup.ilm.enabled: false
