input {
  jdbc {
    jdbc_driver_library => "${SQLITE_JDBC_JAR:/home/alds/sqlite-jdbc.jar}"
    jdbc_driver_class => "org.sqlite.JDBC"
    jdbc_connection_string => "jdbc:sqlite:${ALDS_DB_PATH:/home/alds/alds.db}"
    statement => "SELECT * FROM login_events WHERE id > :sql_last_value"
    use_column_value => true
    tracking_column => "id"
    schedule => "*/5 * * * * *"
  }
}

filter {
  mutate {
    convert => {
      "is_suspicious" => "boolean"
      "risk_score" => "integer"
      "impossible_travel" => "boolean"
      "latitude" => "float"
      "longitude" => "float"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "alds-login-events"
  }
  stdout { codec => json }
}
