name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Development/Sprint-3
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check Sprint-3 backend
        working-directory: Development/Sprint-3
        run: |
          python -m compileall app

      - name: Syntax check Sprint-4
        working-directory: Development/Sprint-4
        run: |
          python -m compileall uc_automation.py test_uc_automation.py

      - name: Run Sprint-4 tests
        working-directory: Development/Sprint-4
        run: |
          python -m unittest -v test_uc_automation.py

      - name: Dependency check
        working-directory: Development/Sprint-3
        run: |
          python -m pip check
