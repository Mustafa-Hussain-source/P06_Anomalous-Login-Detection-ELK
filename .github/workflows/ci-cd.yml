name: ci-cd

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Development/Sprint-3/requirements.txt

      - name: Install dependencies
        working-directory: Development/Sprint-3
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check Sprint-3 backend
        working-directory: Development/Sprint-3
        run: python -m compileall app

      - name: Syntax check Sprint-4
        working-directory: Development/Sprint-4
        run: python -m compileall uc_automation.py test_uc_automation.py

      - name: Run Sprint-4 tests
        working-directory: Development/Sprint-4
        run: python -m unittest -v test_uc_automation.py

      - name: Dependency check
        working-directory: Development/Sprint-3
        run: python -m pip check

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Sprint-3 API image
        run: |
          docker build \
            -f Development/Sprint-3/Dockerfile \
            -t alds-sprint3-api:ci \
            Development/Sprint-3

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: python-checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sonar token precheck
        id: sonar-precheck
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan
        if: steps.sonar-precheck.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=Mustafa-Hussain-source_P06_Anomalous-Login-Detection-ELK
            -Dsonar.organization=mustafa-hussain-source
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Explain why Sonar scan was skipped
        if: steps.sonar-precheck.outputs.enabled == 'false'
        run: |
          echo "SONAR_TOKEN is not configured."
          echo "Set repository secret SONAR_TOKEN to enable SonarQube scan in CI/CD."
