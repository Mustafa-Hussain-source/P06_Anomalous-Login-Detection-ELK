name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_REPO: p06-anomalous-login-detection-elk-backend
  FRONTEND_IMAGE_REPO: p06-anomalous-login-detection-elk-frontend

jobs:
  prepare:
    name: Resolve Deployment Context
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    outputs:
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      backend_image_ref: ${{ steps.context.outputs.backend_image_ref }}
      frontend_image_ref: ${{ steps.context.outputs.frontend_image_ref }}

    steps:
      - name: Compute deployment image refs
        id: context
        run: |
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            commit_sha="${{ github.event.workflow_run.head_sha }}"
            checkout_ref="${{ github.event.workflow_run.head_sha }}"
          else
            commit_sha="${GITHUB_SHA}"
            checkout_ref="${GITHUB_SHA}"
          fi
          backend_image_ref="ghcr.io/${owner_lc}/${BACKEND_IMAGE_REPO}:sha-${commit_sha}"
          frontend_image_ref="ghcr.io/${owner_lc}/${FRONTEND_IMAGE_REPO}:sha-${commit_sha}"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "backend_image_ref=${backend_image_ref}" >> "$GITHUB_OUTPUT"
          echo "frontend_image_ref=${frontend_image_ref}" >> "$GITHUB_OUTPUT"

  deploy-dev-render:
    name: Deploy Dev Render Preview
    runs-on: ubuntu-latest
    needs:
      - prepare
    env:
      BACKEND_IMAGE_REF: ${{ needs.prepare.outputs.backend_image_ref }}
      FRONTEND_IMAGE_REF: ${{ needs.prepare.outputs.frontend_image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Render dev deployment manifest
        run: |
          mkdir -p rendered/dev
          sed "s|image: .*sentinelauth-backend.*|image: ${BACKEND_IMAGE_REF}|" Development/Sprint-3/k8s/deployment.yaml \
            > rendered/dev/dev-rendered.yaml
          printf "\n---\n" >> rendered/dev/dev-rendered.yaml
          cat Development/Sprint-3/k8s/service.yaml >> rendered/dev/dev-rendered.yaml
          printf "\n---\n" >> rendered/dev/dev-rendered.yaml
          sed "s|image: .*sentinelauth-frontend.*|image: ${FRONTEND_IMAGE_REF}|" Development/Sprint-4/Front-End/sentinelauth-ui/k8s/deployment.yaml \
            >> rendered/dev/dev-rendered.yaml
          printf "\n---\n" >> rendered/dev/dev-rendered.yaml
          cat Development/Sprint-4/Front-End/sentinelauth-ui/k8s/service.yaml >> rendered/dev/dev-rendered.yaml

      - name: Validate rendered manifest
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workdir" \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary /workdir/rendered/dev/dev-rendered.yaml

      - name: Upload rendered dev manifest
        uses: actions/upload-artifact@v4
        with:
          name: dev-rendered-manifest
          path: rendered/dev/dev-rendered.yaml

  deploy-dev:
    name: Deploy Dev Smoke Validation
    runs-on: ubuntu-latest
    needs:
      - prepare
      - deploy-dev-render
    environment:
      name: dev
    env:
      BACKEND_IMAGE_REF: ${{ needs.prepare.outputs.backend_image_ref }}
      FRONTEND_IMAGE_REF: ${{ needs.prepare.outputs.frontend_image_ref }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: docker pull "$BACKEND_IMAGE_REF"

      - name: Pull frontend image
        run: docker pull "$FRONTEND_IMAGE_REF"

      - name: Create smoke-test network
        run: docker network create dev-smoke

      - name: Start backend validation container
        run: |
          docker run -d --rm --name alds-dev-backend \
            --network dev-smoke \
            --network-alias sentinelauth-backend-service \
            -p 18000:8000 \
            "$BACKEND_IMAGE_REF"

      - name: Wait for backend readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/docs > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Application did not become ready in time" >&2
          exit 1

      - name: Start frontend validation container
        run: |
          docker run -d --rm --name alds-dev-frontend \
            --network dev-smoke \
            -p 18080:80 \
            "$FRONTEND_IMAGE_REF"

      - name: Wait for frontend readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Frontend did not become ready in time" >&2
          exit 1

      - name: Smoke check docs endpoint
        run: curl --fail http://127.0.0.1:18000/docs

      - name: Smoke check traffic status endpoint
        run: curl --fail http://127.0.0.1:18000/traffic/status

      - name: Smoke check frontend root
        run: curl --fail http://127.0.0.1:18080/

      - name: Smoke check frontend API proxy
        run: curl --fail http://127.0.0.1:18080/api/traffic/status

      - name: Dump container logs on failure
        if: ${{ failure() }}
        run: |
          if docker inspect alds-dev-backend > /dev/null 2>&1; then
            docker logs alds-dev-backend
          else
            echo "Container alds-dev-backend was not created"
          fi
          if docker inspect alds-dev-frontend > /dev/null 2>&1; then
            docker logs alds-dev-frontend
          else
            echo "Container alds-dev-frontend was not created"
          fi

      - name: Stop backend validation container
        if: ${{ always() }}
        run: |
          if docker inspect alds-dev-backend > /dev/null 2>&1; then
            docker stop alds-dev-backend
          else
            echo "Container alds-dev-backend is not running"
          fi

      - name: Stop frontend validation container
        if: ${{ always() }}
        run: |
          if docker inspect alds-dev-frontend > /dev/null 2>&1; then
            docker stop alds-dev-frontend
          else
            echo "Container alds-dev-frontend is not running"
          fi

      - name: Remove smoke-test network
        if: ${{ always() }}
        run: |
          if docker network inspect dev-smoke > /dev/null 2>&1; then
            docker network rm dev-smoke
          else
            echo "Network dev-smoke was not created"
          fi

  deploy-minikube:
    name: Deploy To Minikube
    runs-on: [self-hosted, windows, x64]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - prepare
      - deploy-dev-render
      - deploy-dev
    environment:
      name: dev
    env:
      BACKEND_IMAGE_REF: ${{ needs.prepare.outputs.backend_image_ref }}
      FRONTEND_IMAGE_REF: ${{ needs.prepare.outputs.frontend_image_ref }}
    permissions:
      actions: read
      contents: read
      packages: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download rendered manifest
        uses: actions/download-artifact@v4
        with:
          name: dev-rendered-manifest
          path: rendered/dev

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment images
        run: |
          docker pull $env:BACKEND_IMAGE_REF
          docker pull $env:FRONTEND_IMAGE_REF

      - name: Load images into Minikube
        run: |
          minikube image load $env:BACKEND_IMAGE_REF
          minikube image load $env:FRONTEND_IMAGE_REF

      - name: Apply rendered Kubernetes manifest
        run: |
          kubectl apply -f rendered/dev/dev-rendered.yaml

      - name: Prefer Minikube-loaded images
        run: |
          $backendPatch = '{"spec":{"template":{"spec":{"containers":[{"name":"backend","imagePullPolicy":"IfNotPresent"}]}}}}'
          $frontendPatch = '{"spec":{"template":{"spec":{"containers":[{"name":"frontend","imagePullPolicy":"IfNotPresent"}]}}}}'
          kubectl patch deployment sentinelauth-backend --type merge --patch $backendPatch
          kubectl patch deployment sentinelauth-frontend --type merge --patch $frontendPatch

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/sentinelauth-backend
          kubectl rollout restart deployment/sentinelauth-frontend

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sentinelauth-backend --timeout=180s
          kubectl rollout status deployment/sentinelauth-frontend --timeout=180s

      - name: Verify cluster resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Start port-forwards
        run: |
          $backend = Start-Process kubectl -ArgumentList 'port-forward','service/sentinelauth-backend-service','18000:8000' -PassThru -WindowStyle Hidden
          $frontend = Start-Process kubectl -ArgumentList 'port-forward','service/sentinelauth-service','18080:80' -PassThru -WindowStyle Hidden
          "BACKEND_PF_PID=$($backend.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FRONTEND_PF_PID=$($frontend.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 5

      - name: Wait for live endpoints
        run: |
          $backendReady = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18000/docs | Out-Null
              $backendReady = $true
              break
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $backendReady) {
            throw 'Backend endpoint did not become ready in time'
          }

          $frontendReady = $false
          for ($attempt = 1; $attempt -le 20; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/ | Out-Null
              $frontendReady = $true
              break
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $frontendReady) {
            throw 'Frontend endpoint did not become ready in time'
          }

      - name: Smoke test live backend
        run: |
          $docs = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18000/docs
          $traffic = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18000/traffic/status
          Write-Host "Backend docs status: $($docs.StatusCode)"
          Write-Host "Backend traffic status: $($traffic.StatusCode)"
          Write-Host $traffic.Content

      - name: Smoke test live frontend
        run: |
          $root = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/
          $proxy = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18080/api/traffic/status
          Write-Host "Frontend root status: $($root.StatusCode)"
          Write-Host "Frontend proxy status: $($proxy.StatusCode)"
          Write-Host $proxy.Content

      - name: Dump diagnostics on failure
        if: ${{ failure() }}
        run: |
          kubectl get pods -o wide
          kubectl describe deployment sentinelauth-backend
          kubectl describe deployment sentinelauth-frontend
          kubectl logs deployment/sentinelauth-backend --tail=200
          kubectl logs deployment/sentinelauth-frontend --tail=200

      - name: Stop backend port-forward
        if: ${{ always() }}
        run: |
          if ($env:BACKEND_PF_PID) {
            Stop-Process -Id $env:BACKEND_PF_PID -Force -ErrorAction SilentlyContinue
          }

      - name: Stop frontend port-forward
        if: ${{ always() }}
        run: |
          if ($env:FRONTEND_PF_PID) {
            Stop-Process -Id $env:FRONTEND_PF_PID -Force -ErrorAction SilentlyContinue
          }
